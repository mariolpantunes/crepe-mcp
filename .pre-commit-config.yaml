# The CI gate, moved to commit time.
#
# Every hook is `language: system`, not a pinned mirror. A mirror would fetch
# its own copy of ruff or basedpyright and run it against a config pre-commit
# chose, which is how a repository ends up with hooks that pass and CI that
# fails. These call the tools already installed in the environment and let them
# read pyproject.toml, so `git commit` and CI run the same check with the same
# settings by construction.
#
# `pass_filenames: false` on the whole-project tools is deliberate. basedpyright
# and vulture both need to see every file to be correct -- vulture calls a
# function dead when nothing references it, and handing it only the staged files
# means everything they reference looks unreferenced.
#
# `files` rather than `types: [python]` on the project-wide hooks: they are
# driven by pyproject.toml (ruff rules, basedpyright mode, vulture paths), so
# a commit that changes only that file must still run them.
#
# Install with: pre-commit install
# Run over everything once: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      # Keys live only in ~/.config/crepe-mcp/.env. Blocks a Tavily key or any *_API_KEY set to a
      # 20+ character literal (the failure it prevents: a key pasted into a config, doc or test).
      - id: no-api-keys
        name: no API keys in the tree
        entry: '(tvly-[A-Za-z0-9_-]{16,}|_API_KEY[^A-Za-z0-9_]{0,3}[:=][^A-Za-z0-9_-]{0,4}[A-Za-z0-9_-]{20,})'
        language: pygrep
        exclude: '^\.env\.example$'

      # Resolve ./venv the way the runner does, before anything reads it. CI installs the project
      # into a clean machine; a venv with an editable crepe-mcp would satisfy the requirement while
      # loading unreleased source, so a local check could pass against code the servers (which run
      # from venv/bin/crepe-*) never see. Editable installs are removed first, which `pip install`
      # cannot do for itself. Installs the package plus the `test` dependency group (pip >= 25.1).
      - id: venv-matches-ci
        name: venv matches CI
        entry: >-
          bash -c '
          [ -d venv ] || python3 -m venv venv;
          eds=$(venv/bin/pip list --editable --format=freeze 2>/dev/null
          | sed "s/[=@ ].*//" | grep -vix crepe-mcp || true);
          [ -n "$eds" ] && venv/bin/pip uninstall -y -q $eds;
          venv/bin/pip install -q --upgrade . --group test'
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: ruff
        name: ruff
        entry: ruff check .
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: vulture src/crepe_mcp
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: unittest
        name: unittest (tests)
        entry: env PYTHONPATH=src venv/bin/python -m unittest discover -s tests -p "test_*.py"
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: coverage
        name: coverage (unittest, --fail-under)
        # Same run as `unittest`, measured, kept separate so a coverage drop reads as a coverage
        # failure. The floor ratchets up only: never lower it to make a commit pass.
        entry: >-
          bash -c 'PYTHONPATH=src venv/bin/python -m coverage run --source=crepe_mcp
          -m unittest discover -s tests -q && venv/bin/python -m coverage report
          --fail-under=72'
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false
