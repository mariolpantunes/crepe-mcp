<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="CREPE — MCP Server">
  <title>CREPE MCP Server</title>
  <desc>A golden folded crêpe wearing a Nord dark blue baseball cap with the official Model Context Protocol (MCP) logo.</desc>

  <style>
    .cell        { fill: #f8fafc; stroke: #cbd5e1; }
    .cap-crown   { fill: #2E3440; stroke: #1e2530; }
    .cap-visor   { fill: #242933; stroke: #1e2530; }
    .cap-button  { fill: #434C5E; stroke: #2E3440; }
    .cap-seam    { stroke: #3B4252; stroke-width: 0.8; fill: none; }
    .mcp-frost   { stroke: #88C0D0; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    @media (prefers-color-scheme: dark) {
      .cell        { fill: #0f172a; stroke: #334155; }
      .cap-crown   { fill: #2E3440; stroke: #1e2530; }
      .cap-visor   { fill: #1e2530; stroke: #13171f; }
      .cap-button  { fill: #4C566A; stroke: #2E3440; }
      .cap-seam    { stroke: #3B4252; stroke-width: 0.8; fill: none; }
    }
  </style>

  <!-- Bounded card frame -->
  <rect class="cell" x="14" y="14" width="100" height="100" rx="16" stroke-width="3"/>

