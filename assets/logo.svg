  <!-- Baseball Cap (Nord Dark Blue / Black) -->
  <g id="baseball-cap">
    <!-- Cap Visor / Curved Brim -->
    <path class="cap-visor" stroke-width="1.3" stroke-linejoin="round"
          d="M 38 48 C 38 48, 27 54, 29 57.5 C 31 60.5, 56 60.5, 69 53 C 65 49, 52 48, 38 48 Z"/>

    <!-- Visor Underside Shadow Curve -->
    <path d="M 31 57 Q 48 60.5 67 53.5" stroke="#181c24" stroke-width="1.2" fill="none" opacity="0.7"/>

    <!-- Cap Crown (Smooth Dome) -->
    <path class="cap-crown" stroke-width="1.5" stroke-linejoin="round"
          d="M 40 49 C 39 32.5, 50 19.5, 66 19.5 C 82 19.5, 93 32.5, 91 49 C 83 52, 48 52, 40 49 Z"/>

    <!-- Cap Panel Seam Lines -->
    <path class="cap-seam" d="M 66 19.5 Q 65 34 66 49"/>
    <path class="cap-seam" d="M 66 19.5 Q 52 30 43 45"/>
    <path class="cap-seam" d="M 66 19.5 Q 79 30 88 45"/>

    <!-- Top Button (Squatchee) -->
    <ellipse class="cap-button" cx="66" cy="19.5" rx="3.2" ry="2" stroke-width="0.8"/>

    <!-- Official Model Context Protocol (MCP) Logo on Front Panel (Nord Frost Cyan) -->
    <g id="mcp-logo" transform="translate(56.5, 28.5) scale(0.102)">
      <!-- Official MCP Interlocking Node Strokes -->
